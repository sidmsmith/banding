<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banding v1.0.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2d2d2d;
      --border: #333;
      --text: #e0e0e0;
      --text-secondary: #bbbbbb;
      --text-muted: #999;
      --red-bg: #4a1a1a;
      --red-text: #ff6b6b;
      --blue-select: #339af0;
      --success: #28a745;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --success-hover: #218838;
      --table-header-bg: #2a2a2a;
      --table-header-text: #e0e0e0;
      --input-border: #444;
      --input-focus-bg: #333;
      --input-focus-border: var(--primary);
      --input-focus-shadow: rgba(13, 110, 253, 0.25);
    }

    body { 
      background: var(--bg-dark); 
      color: var(--text); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .main-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .form-control, .form-select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--input-focus-bg);
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 0.2rem var(--input-focus-shadow);
      color: var(--text);
    }

    .btn-primary { background: var(--primary); border: none; }
    .btn-success { background: var(--success); border: none; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success:hover { background: var(--success-hover); }

    /* STATUS BAR */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 0.5rem 0;
      min-height: 2rem;
    }
    .status { 
      font-weight: 600; 
      padding: 0.25rem 0;
      flex: 1;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--red-text); }

    /* TABLE CONTAINER */
    .table-container {
      flex: 1;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0.5rem 0;
    }

    .table { 
      font-size: 0.9em; 
      margin-bottom: 0;
      width: 100%;
    }
    .table th { 
      position: sticky; 
      top: 0; 
      background: var(--table-header-bg); 
      z-index: 5;
      color: var(--table-header-text) !important;
      padding: 0.75rem;
    }
    .table td {
      padding: 0.75rem;
    }

    /* ROW STYLES */
    .selected-row td { 
      background-color: var(--blue-select) !important; 
      color: white !important; 
      font-weight: bold !important;
    }

    /* STICKY FOOTER */
    .footer {
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      padding: 1rem;
      border-top: 1px solid var(--border);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .form-label { color: var(--text-secondary); font-weight: 600; }
    small { color: var(--text-muted); }
    h2 { color: var(--primary); }

    /* HIDDEN UNTIL AUTH */
    #mainUI { display: none; }

    /* ORG INPUT SIZE */
    #org {
      width: 250px;
      max-width: 100%;
    }

    /* HEADER SECTION */
    .header-section {
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="header-section">
      <h2 class="text-center mb-4">Banding v1.0.0</h2>
    </div>

    <!-- ORG -->
    <div class="mb-3">
      <label class="form-label">ORG:</label>
      <input type="text" id="org" class="form-control" placeholder="Enter ORG" maxlength="20" />
      <small>Press Enter to authenticate</small>
    </div>

    <!-- MAIN UI (Hidden until auth) -->
    <div id="mainUI">
      <!-- STATUS BAR -->
      <div class="status-bar">
        <div class="status" id="status">Authenticated – ready! Loading orders...</div>
      </div>

      <!-- SCROLLABLE TABLE -->
      <div class="table-container">
        <table class="table table-dark table-hover" id="resultsTable">
          <thead>
            <tr>
              <th>Order</th>
              <th>Location</th>
              <th># oLPNs</th>
              <th>SVIA</th>
              <th>Divert Date/Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- STICKY FOOTER -->
      <div class="footer">
        <div><strong>Selected:</strong> <span id="selected">None</span></div>
        <button id="selectOrderBtn" class="btn btn-success" disabled>Select Order</button>
      </div>
    </div>
  </div>

  <script>
    const orgInput = document.getElementById('org');
    const mainUI = document.getElementById('mainUI');
    const resultsBody = document.querySelector('#resultsTable tbody');
    const statusEl = document.getElementById('status');
    const selectedEl = document.getElementById('selected');
    const selectOrderBtn = document.getElementById('selectOrderBtn');

    let token = null;
    let org = null;
    let selectedOrder = null;
    let ordersData = [];

    // API helper
    async function api(endpoint, data) {
      try {
        const res = await fetch(`/api/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await res.json();
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    // Status helper
    function status(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ` ${type}` : '');
    }

    // Auth
    orgInput.addEventListener('keypress', async e => {
      if (e.key !== 'Enter') return;
      const orgValue = orgInput.value.trim();
      if (!orgValue) return status('ORG required', 'error');
      
      status('Authenticating...');
      const res = await api('auth', { org: orgValue });
      
      if (!res.success) {
        return status(res.error || 'Auth failed', 'error');
      }
      
      token = res.token;
      org = orgValue;
      status('Authenticated – ready! Loading orders...', 'success');
      
      mainUI.style.display = 'block';
      
      // Automatically search for orders after authentication
      await loadOrders();
    });

    // Load orders
    async function loadOrders() {
      if (!token || !org) return;
      
      status('Searching for orders with Status=7200...');
      const res = await api('searchOrders', { org, token });
      
      if (!res.success) {
        return status('Failed to load orders: ' + (res.error || 'Unknown error'), 'error');
      }
      
      ordersData = res.results || [];
      
      if (ordersData.length === 0) {
        status('No orders found with Status=7200', 'error');
        renderResults([]);
        return;
      }
      
      status(`Found ${ordersData.length} orders`, 'success');
      renderResults(ordersData);
    }

    // Render results
    function renderResults(results) {
      resultsBody.innerHTML = '';
      
      if (results.length === 0) {
        const row = document.createElement('tr');
        row.innerHTML = '<td colspan="5" class="text-center">No orders found</td>';
        resultsBody.appendChild(row);
        return;
      }
      
      results.forEach(order => {
        const row = document.createElement('tr');
        row.dataset.orderId = order.OrderId;
        
        row.innerHTML = `
          <td>${order.OrderId || '—'}</td>
          <td>${order.Location || '—'}</td>
          <td>${order.OlpnCount || 0}</td>
          <td>${order.SVIA || '—'}</td>
          <td>${order.DivertDateTime || '—'}</td>
        `;
        row.onclick = () => selectRow(row, order);
        resultsBody.appendChild(row);
      });
    }

    // Select row
    function selectRow(row, order) {
      // Remove previous selection
      document.querySelectorAll('#resultsTable tbody tr').forEach(r => {
        r.classList.remove('selected-row');
      });
      
      // Add selection to clicked row
      row.classList.add('selected-row');
      selectedOrder = order;
      selectedEl.textContent = order.OrderId || 'None';
      selectOrderBtn.disabled = false;
    }

    // Select Order button
    selectOrderBtn.onclick = () => {
      if (!selectedOrder) return;
      
      // Navigate to order detail page (to be implemented)
      // For now, just show an alert
      alert(`Selected Order: ${selectedOrder.OrderId}\n\nOrder detail page to be implemented.`);
      
      // TODO: Navigate to order detail page
      // window.location.href = `/order/${selectedOrder.OrderId}`;
    };
  </script>
</body>
</html>
