<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:," />
  <title>Banding v1.0.2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2d2d2d;
      --border: #333;
      --text: #e0e0e0;
      --text-secondary: #bbbbbb;
      --text-muted: #999;
      --red-bg: #4a1a1a;
      --red-text: #ff6b6b;
      --blue-select: #339af0;
      --success: #28a745;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --success-hover: #218838;
      --table-header-bg: #2a2a2a;
      --table-header-text: #e0e0e0;
      --input-border: #444;
      --input-focus-bg: #333;
      --input-focus-border: var(--primary);
      --input-focus-shadow: rgba(13, 110, 253, 0.25);
      --logo-url: none;
      --logo-display: none;
    }

    body { 
      background: var(--bg-dark); 
      color: var(--text); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .main-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .form-control, .form-select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--input-focus-bg);
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 0.2rem var(--input-focus-shadow);
      color: var(--text);
    }

    .btn-primary { background: var(--primary); border: none; }
    .btn-success { background: var(--success); border: none; }
    .btn-danger { background: var(--red-text); border: none; color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-danger:hover { background: var(--red-text); opacity: 0.9; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Order Detail: 200px spacing between the three input units */
    .order-detail-unit-gap { margin-right: 200px; }

    /* STATUS BAR */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 0.5rem 0;
      min-height: 2rem;
    }
    .status { 
      font-weight: 600; 
      padding: 0.25rem 0;
      flex: 1;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--red-text); }
    .status.info { color: var(--primary); }
    #orderDetailStatus { font-weight: 600; }

    .olpn-bundle-icon {
      display: inline-block;
      margin-right: 0.35rem;
      color: var(--primary);
      font-size: 0.95em;
    }

    /* TABLE CONTAINER */
    .table-container {
      flex: 1;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0.5rem 0;
    }

    .table { 
      font-size: 0.9em; 
      margin-bottom: 0;
      width: 100%;
    }
    .table th { 
      position: sticky; 
      top: 0; 
      background: var(--table-header-bg); 
      z-index: 5;
      color: var(--table-header-text) !important;
      padding: 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .table th:hover {
      background: var(--primary) !important;
      opacity: 0.9;
    }
    .table th .sort-indicator {
      margin-left: 0.5rem;
      font-size: 0.8em;
    }
    .table td {
      padding: 0.75rem;
    }

    /* ROW STYLES */
    .selected-row td { 
      background-color: var(--blue-select) !important; 
      color: white !important; 
      font-weight: bold !important;
    }

    /* STICKY FOOTER */
    .footer {
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      padding: 1rem;
      border-top: 1px solid var(--border);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .form-label { color: var(--text-secondary); font-weight: 600; }
    small { color: var(--text-muted); }
    h2 { color: var(--primary); }

    /* HIDDEN UNTIL AUTH */
    #mainUI { display: none; }

    /* ORG INPUT SIZE */
    #org {
      width: 250px;
      max-width: 100%;
    }

    /* HEADER SECTION */
    .header-section {
      margin-bottom: 1.5rem;
      position: relative;
    }

    /* THEME SELECTOR */
    .theme-selector-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      color: var(--text);
      padding: 0;
      cursor: pointer;
      font-size: 1.5rem;
      z-index: 1000;
      transition: opacity 0.2s;
    }
    .theme-selector-btn:hover {
      opacity: 0.7;
    }

    /* LOGO */
    .theme-logo {
      display: var(--logo-display);
      max-height: 60px;
      max-width: 200px;
      margin: 0 auto 1rem;
      object-fit: contain;
    }
    .theme-logo[src] {
      display: block !important;
    }
    .theme-logo:not([src]) {
      display: none !important;
    }

    .header-with-logo {
      position: relative;
    }

    /* Console Output */
    .console-output {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 0.8em;
      padding: 0.75rem;
      height: 300px;
      overflow-y: auto;
      margin-top: 1rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .console-output .error { color: var(--red-text); }
    .console-output .success { color: #51cf66; }
    .console-output .info { color: var(--blue-select); }
    .console-output .warning { color: #ffd43b; }

    /* MODAL */
    .modal-content {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .modal-header, .modal-footer {
      border-color: var(--border);
    }

    .section-frame {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: var(--card-bg);
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .order-detail-readonly {
      width: 24ch !important;
      max-width: 24ch;
      min-width: 24ch;
      box-sizing: border-box;
      background-color: var(--input-bg) !important;
      color: var(--text-muted) !important;
      cursor: not-allowed !important;
    }
    .order-detail-20ch {
      width: 24ch !important;
      max-width: 24ch;
      min-width: 24ch;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="header-section">
      <button class="theme-selector-btn" id="themeSelectorBtn" title="Select Theme">
        <i class="fas fa-cog"></i>
      </button>
      <div class="header-with-logo">
        <img id="themeLogo" class="theme-logo" alt="Theme Logo" />
        <h2 class="text-center mb-4">Banding v1.0.2</h2>
      </div>
    </div>

    <!-- ORG -->
    <div id="orgSection" class="mb-3">
      <label class="form-label">ORG:</label>
      <input type="text" id="org" class="form-control" placeholder="Enter ORG" maxlength="20" />
      <small>Press Enter to authenticate</small>
    </div>

    <!-- MAIN UI (Hidden until auth) -->
    <div id="mainUI">
      <!-- STATUS BAR (visible on both Order List and Order Detail screens) -->
      <div class="status-bar">
        <div class="status" id="status">Authenticated – ready! Loading orders...</div>
      </div>

      <!-- ORDER LIST SCREEN -->
      <div id="orderListScreen">
      <!-- SCROLLABLE TABLE -->
      <div class="table-container">
        <table class="table table-dark table-hover" id="resultsTable">
          <thead>
            <tr>
              <th data-sort="OrderId" data-sort-type="string">Order <span class="sort-indicator"></span></th>
              <th data-sort="Location" data-sort-type="string">Location <span class="sort-indicator"></span></th>
              <th data-sort="OlpnCount" data-sort-type="number"># oLPNs <span class="sort-indicator"></span></th>
              <th data-sort="SVIA" data-sort-type="string">SVIA <span class="sort-indicator"></span></th>
              <th data-sort="DivertDateTime" data-sort-type="string">Divert Date/Time <span class="sort-indicator"></span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- STICKY FOOTER -->
      <div class="footer">
        <div><strong>Selected:</strong> <span id="selected">None</span></div>
        <button id="selectOrderBtn" class="btn btn-success" disabled>Select Order</button>
      </div>

      <!-- Console Toggle Button -->
      <div class="text-center mt-3" id="consoleToggleContainer">
        <button class="btn btn-sm btn-outline-secondary" id="consoleToggleBtn" type="button" title="Toggle Console">
          <i class="fas fa-terminal" id="consoleToggleIcon"></i> Console
        </button>
      </div>

      <!-- Console Window -->
      <div id="consoleSection" class="mt-4" style="display:none;">
        <div class="section-frame">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title">Console</div>
            <button class="btn btn-sm btn-outline-secondary" id="consoleCloseBtn" type="button" title="Hide Console">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="console-output" id="console"></div>
        </div>
      </div>
      </div>
      <!-- END ORDER LIST SCREEN -->

      <!-- ORDER DETAIL SCREEN (hidden until Select Order) -->
      <div id="orderDetailScreen" style="display: none;">
        <div class="mb-3">
          <label class="form-label">Order:</label>
          <input type="text" id="orderDetailOrderId" class="form-control order-detail-readonly" readonly placeholder="Order ID" maxlength="20" />
        </div>
        <div class="mb-3 d-flex flex-nowrap order-detail-bundle-row">
          <div class="d-flex flex-column gap-2 flex-shrink-0 order-detail-unit-gap">
            <label class="form-label">Bundle oLPN:</label>
            <div class="d-flex align-items-center gap-2">
              <input type="text" id="scanOlpnInput" class="form-control order-detail-20ch" placeholder="Enter oLPN" maxlength="20" />
            </div>
          </div>
          <div class="d-flex flex-column gap-2 flex-shrink-0 order-detail-unit-gap">
            <label class="form-label">Add oLPN to Bundle:</label>
            <div class="d-flex align-items-center gap-2">
              <input type="text" id="addOlpnToBundleInput" class="form-control order-detail-20ch" placeholder="Enter oLPN" maxlength="20" />
              <button id="updateBundleBtn" class="btn btn-success" type="button" disabled>Add</button>
            </div>
          </div>
          <div class="d-flex flex-column gap-2 flex-shrink-0">
            <label class="form-label">Remove oLPN from Bundle:</label>
            <div class="d-flex align-items-center gap-2">
              <input type="text" id="removeOlpnFromBundleInput" class="form-control order-detail-20ch" placeholder="Enter oLPN" maxlength="20" />
              <button id="removeFromBundleBtn" class="btn btn-danger" type="button" disabled>Remove</button>
            </div>
          </div>
        </div>
        <div class="d-flex flex-wrap justify-content-between gap-3 mb-3">
          <div>oLPNs in Bundle: XXX</div>
          <div>Ship Via: XXX</div>
          <div>Bundle Weight: XXX</div>
          <div>Max. Weight: XXX</div>
          <div>Order Weight: XXX</div>
        </div>
        <div class="table-container mb-3">
          <table class="table table-dark table-hover" id="orderDetailTable">
            <thead>
              <tr>
                <th>Location</th>
                <th>oLPN</th>
                <th>Quantity</th>
                <th>Weight</th>
              </tr>
            </thead>
            <tbody id="orderDetailTableBody"></tbody>
          </table>
        </div>
        <div class="mt-3 mb-2">
          <div id="orderDetailStatus" class="status-bar status-bar-inline py-2 px-3 rounded" style="min-height: 2.5rem; background: var(--card-bg); border: 1px solid var(--border); color: var(--text);">
            <span id="orderDetailStatusText"></span>
          </div>
        </div>
        <div class="mt-2">
          <button id="orderDetailBackBtn" class="btn btn-secondary" type="button">
            <i class="fas fa-arrow-left"></i> Back
          </button>
        </div>
      </div>
      <!-- END ORDER DETAIL SCREEN -->
    </div>
  </div>

  <!-- THEME SELECTOR MODAL -->
  <div class="modal fade" id="themeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Select Theme</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="list-group" id="themeList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const APP_VERSION = 'v1.0.2';
    
    // URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const organizationParam = urlParams.get('Organization');
    const orgParam = urlParams.get('ORG');
    const consoleParam = urlParams.get('Console');
    const orderParam = urlParams.get('Order');
    const orderIdParam = urlParams.get('OrderId');
    
    const urlOrg = organizationParam || orgParam || null;
    const urlConsole = consoleParam || null;
    const urlOrder = orderParam || orderIdParam || null;

    const orgInput = document.getElementById('org');
    const mainUI = document.getElementById('mainUI');
    const resultsBody = document.querySelector('#resultsTable tbody');
    const statusEl = document.getElementById('status');
    const selectedEl = document.getElementById('selected');
    const selectOrderBtn = document.getElementById('selectOrderBtn');
    const consoleSection = document.getElementById('consoleSection');
    const consoleEl = document.getElementById('console');
    const consoleToggleBtn = document.getElementById('consoleToggleBtn');
    const consoleCloseBtn = document.getElementById('consoleCloseBtn');
    const consoleToggleContainer = document.getElementById('consoleToggleContainer');
    const themeSelectorBtn = document.getElementById('themeSelectorBtn');
    const themeModal = new bootstrap.Modal(document.getElementById('themeModal'));
    const themeList = document.getElementById('themeList');
    const themeLogo = document.getElementById('themeLogo');
    const orderListScreen = document.getElementById('orderListScreen');
    const orderDetailScreen = document.getElementById('orderDetailScreen');
    const orderDetailOrderId = document.getElementById('orderDetailOrderId');
    const scanOlpnInput = document.getElementById('scanOlpnInput');
    const orderDetailTableBody = document.getElementById('orderDetailTableBody');
    const orderDetailBackBtn = document.getElementById('orderDetailBackBtn');
    const addOlpnToBundleInput = document.getElementById('addOlpnToBundleInput');
    const updateBundleBtn = document.getElementById('updateBundleBtn');
    const removeOlpnFromBundleInput = document.getElementById('removeOlpnFromBundleInput');
    const removeFromBundleBtn = document.getElementById('removeFromBundleBtn');
    const orderDetailStatusText = document.getElementById('orderDetailStatusText');
    const orderDetailStatusBox = document.getElementById('orderDetailStatus');

    let token = null;
    let org = null;
    let selectedOrder = null;
    let ordersData = [];
    let currentSort = { column: 'OrderId', direction: 'asc' }; // Default sort
    let currentOrderOlpns = []; // oLPNs for the current Order Detail screen (for Validate)

    // Console logging function
    function logToConsole(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
      if (consoleEl) {
        consoleEl.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }
      // Only log errors to browser console for debugging unexpected issues
      if (type === 'error') {
        console.error(`[${timestamp}] ${message}`);
      }
    }

    // Function to mask token in data objects
    function maskToken(data) {
      if (!data || typeof data !== 'object') return data;
      
      const masked = JSON.parse(JSON.stringify(data)); // Deep copy
      
      if (masked.token && typeof masked.token === 'string') {
        const token = masked.token;
        if (token.length > 10) {
          masked.token = token.substring(0, 4) + '...' + token.substring(token.length - 4);
        } else {
          masked.token = '***';
        }
      }
      
      return masked;
    }

    // API helper with logging
    async function api(endpoint, data) {
      try {
        logToConsole(`[API] Calling ${endpoint}...`, 'info');
        logToConsole(`[API] Request Payload:`, 'info');
        const maskedData = maskToken(data);
        logToConsole(JSON.stringify(maskedData, null, 2), 'info');
        
        const res = await fetch(`/api/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await res.json();
        
        logToConsole(`[API] Response:`, result.success ? 'success' : 'error');
        const maskedResult = maskToken(result);
        logToConsole(JSON.stringify(maskedResult, null, 2), result.success ? 'success' : 'error');
        
        return result;
      } catch (error) {
        logToConsole(`[API] Exception: ${error.message}`, 'error');
        return { success: false, error: error.message };
      }
    }

    // Status helper (main status bar – visible on both screens now)
    function status(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ` ${type}` : '');
    }

    // Order Detail screen status (message box above Back button)
    function setOrderDetailStatus(msg, type = '') {
      if (!orderDetailStatusText) return;
      orderDetailStatusText.textContent = msg || '';
      orderDetailStatusText.className = type ? `status ${type}` : 'status';
      if (orderDetailStatusBox) {
        orderDetailStatusBox.style.borderColor = type === 'error' ? 'var(--red-text)' : type === 'success' ? 'var(--success)' : 'var(--border)';
      }
    }

    // THEME DEFINITIONS
    const themes = {
      'dark': {
        name: 'Dark',
        colors: {
          '--bg-dark': '#121212',
          '--card-bg': '#1e1e1e',
          '--input-bg': '#2d2d2d',
          '--border': '#333',
          '--text': '#e0e0e0',
          '--text-secondary': '#bbbbbb',
          '--text-muted': '#999',
          '--red-bg': '#4a1a1a',
          '--red-text': '#ff6b6b',
          '--blue-select': '#339af0',
          '--success': '#28a745',
          '--primary': '#0d6efd',
          '--primary-hover': '#0b5ed7',
          '--success-hover': '#218838',
          '--table-header-bg': '#2a2a2a',
          '--table-header-text': '#e0e0e0',
          '--input-border': '#444',
          '--input-focus-bg': '#333',
          '--input-focus-border': '#0d6efd',
          '--input-focus-shadow': 'rgba(13, 110, 253, 0.25)',
          '--logo-url': 'none',
          '--logo-display': 'none'
        },
        logo: null
      },
      'light': {
        name: 'Light',
        colors: {
          '--bg-dark': '#f8f9fa',
          '--card-bg': '#ffffff',
          '--input-bg': '#f5f5f5',
          '--border': '#dee2e6',
          '--text': '#212529',
          '--text-secondary': '#495057',
          '--text-muted': '#6c757d',
          '--red-bg': '#fff5f5',
          '--red-text': '#dc3545',
          '--blue-select': '#0056b3',
          '--success': '#28a745',
          '--primary': '#0d6efd',
          '--primary-hover': '#0b5ed7',
          '--success-hover': '#218838',
          '--table-header-bg': '#6c757d',
          '--table-header-text': '#ffffff',
          '--input-border': '#ced4da',
          '--input-focus-bg': '#ffffff',
          '--input-focus-border': '#0d6efd',
          '--input-focus-shadow': 'rgba(13, 110, 253, 0.25)',
          '--logo-url': 'none',
          '--logo-display': 'none'
        },
        logo: null
      },
      'manhattan': {
        name: 'Manhattan Associates',
        colors: {
          '--bg-dark': '#f5f7fa',
          '--card-bg': '#ffffff',
          '--input-bg': '#f0f2f5',
          '--border': '#e1e8ed',
          '--text': '#1a1a1a',
          '--text-secondary': '#4a5568',
          '--text-muted': '#718096',
          '--red-bg': '#fff5f5',
          '--red-text': '#e53e3e',
          '--blue-select': '#3182ce',
          '--success': '#38a169',
          '--primary': '#0066cc',
          '--primary-hover': '#0052a3',
          '--success-hover': '#2f855a',
          '--table-header-bg': '#0066cc',
          '--table-header-text': '#ffffff',
          '--input-border': '#cbd5e0',
          '--input-focus-bg': '#ffffff',
          '--input-focus-border': '#0066cc',
          '--input-focus-shadow': 'rgba(0, 102, 204, 0.25)',
          '--logo-url': 'url("manhattan-logo.png")',
          '--logo-display': 'block'
        },
        logo: 'manhattan-logo.png'  // Logo is in root directory, served as /manhattan-logo.png
      }
    };

    // THEME FUNCTIONS
    function applyTheme(themeKey) {
      const theme = themes[themeKey];
      if (!theme) return;

      const root = document.documentElement;
      Object.entries(theme.colors).forEach(([property, value]) => {
        root.style.setProperty(property, value);
      });

      // Update logo
      if (theme.logo && themeLogo) {
        // Logo is in root directory, server serves static files from root
        const logoPath = '/' + theme.logo;
        console.log('Setting logo src to:', logoPath);
        console.log('Theme logo value:', theme.logo);
        console.log('Current theme:', themeKey);
        
        // Set src and display
        themeLogo.src = logoPath;
        themeLogo.style.display = 'block';
        themeLogo.style.visibility = 'visible';
        
        // Remove any existing event listeners by cloning
        const oldOnError = themeLogo.onerror;
        const oldOnLoad = themeLogo.onload;
        themeLogo.onerror = null;
        themeLogo.onload = null;
        
        themeLogo.onerror = function(e) {
          // Log error and show in UI console
          const errorMsg = `Logo failed to load: ${logoPath}. Check Network tab for 404 error.`;
          console.error(errorMsg, e);
          logToConsole(errorMsg, 'error');
          this.style.display = 'none';
        };
        
        themeLogo.onload = function() {
          console.log('Logo loaded successfully:', logoPath, 'Size:', this.naturalWidth, 'x', this.naturalHeight);
          logToConsole(`Logo loaded successfully: ${logoPath}`, 'success');
          this.style.display = 'block';
        };
        
        // If image is already cached and loaded, trigger onload manually
        if (themeLogo.complete && themeLogo.naturalHeight !== 0) {
          themeLogo.onload();
        }
      } else {
        if (themeLogo) {
          console.log('No logo for theme:', themeKey, 'theme.logo:', theme.logo);
          themeLogo.style.display = 'none';
        } else {
          console.error('themeLogo element not found in DOM');
        }
      }

      // Update table class for light themes
      const table = document.getElementById('resultsTable');
      const orderDetailTable = document.getElementById('orderDetailTable');
      const tableClass = themeKey === 'dark' ? 'table table-dark table-hover' : 'table table-hover';
      if (table) table.className = tableClass;
      if (orderDetailTable) orderDetailTable.className = tableClass;

      // Save to localStorage
      localStorage.setItem('selectedTheme', themeKey);
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem('selectedTheme') || 'dark';
      console.log('Loading theme:', savedTheme);
      console.log('themeLogo element:', themeLogo);
      console.log('Theme logo path:', themes[savedTheme]?.logo);
      applyTheme(savedTheme);
      
      // Force logo check after a short delay to ensure DOM is ready
      setTimeout(() => {
        if (themeLogo) {
          console.log('Logo src after theme apply:', themeLogo.src);
          console.log('Logo display style:', themeLogo.style.display);
          console.log('Logo computed display:', window.getComputedStyle(themeLogo).display);
          if (themeLogo.src && !themeLogo.complete) {
            console.log('Logo image not yet loaded, waiting...');
          }
        }
      }, 100);
      
      // Load saved sort preference
      const savedSort = localStorage.getItem('bandingSort');
      if (savedSort) {
        try {
          currentSort = JSON.parse(savedSort);
        } catch (e) {
          // Silently fail - will use default sort
        }
      }
    }
    
    // Sorting functions
    function sortOrders(data, column, direction) {
      const sorted = [...data];
      const sortType = document.querySelector(`th[data-sort="${column}"]`)?.dataset.sortType || 'string';
      
      sorted.sort((a, b) => {
        let aVal = a[column] || '';
        let bVal = b[column] || '';
        
        // Handle different data types
        if (sortType === 'number') {
          aVal = Number(aVal) || 0;
          bVal = Number(bVal) || 0;
        } else {
          aVal = String(aVal).toLowerCase();
          bVal = String(bVal).toLowerCase();
        }
        
        if (aVal < bVal) return direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return direction === 'asc' ? 1 : -1;
        return 0;
      });
      
      return sorted;
    }
    
    function updateSortIndicators() {
      // Clear all indicators
      document.querySelectorAll('.table th .sort-indicator').forEach(indicator => {
        indicator.textContent = '';
      });
      
      // Add indicator to current sort column
      const currentHeader = document.querySelector(`th[data-sort="${currentSort.column}"]`);
      if (currentHeader) {
        const indicator = currentHeader.querySelector('.sort-indicator');
        if (indicator) {
          indicator.textContent = currentSort.direction === 'asc' ? '↑' : '↓';
        }
      }
    }
    
    function handleHeaderClick(header) {
      const column = header.dataset.sort;
      if (!column) return;
      
      // Toggle direction if clicking same column, otherwise default to asc
      if (currentSort.column === column) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.column = column;
        currentSort.direction = 'asc';
      }
      
      // Save to localStorage
      localStorage.setItem('bandingSort', JSON.stringify(currentSort));
      
      // Update indicators and re-render
      updateSortIndicators();
      if (ordersData.length > 0) {
        const sortedData = sortOrders(ordersData, currentSort.column, currentSort.direction);
        renderResults(sortedData);
      }
      
      // Sort applied (no logging needed)
    }

    function renderThemeList() {
      if (!themeList) return;
      themeList.innerHTML = '';
      const currentTheme = localStorage.getItem('selectedTheme') || 'dark';
      
      Object.entries(themes).forEach(([key, theme]) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = `list-group-item list-group-item-action ${key === currentTheme ? 'active' : ''}`;
        item.textContent = theme.name;
        item.onclick = () => {
          applyTheme(key);
          themeModal.hide();
        };
        themeList.appendChild(item);
      });
    }

    // Initialize theme selector
    if (themeSelectorBtn) {
      themeSelectorBtn.onclick = () => {
        renderThemeList();
        themeModal.show();
      };
    }

    // Console toggle
    if (consoleToggleBtn) {
      consoleToggleBtn.addEventListener('click', () => {
        if (consoleSection) {
          const isHidden = consoleSection.style.display === 'none' || !consoleSection.style.display;
          consoleSection.style.display = isHidden ? 'block' : 'none';
        }
      });
    }

    if (consoleCloseBtn) {
      consoleCloseBtn.addEventListener('click', () => {
        if (consoleSection) {
          consoleSection.style.display = 'none';
        }
      });
    }

    // Check for Console parameter and handle visibility
    if (urlConsole) {
      const consoleValue = urlConsole.toUpperCase();
      if (consoleValue === 'Y') {
        if (consoleSection) {
          consoleSection.style.display = 'block';
          logToConsole('Console window opened via URL parameter (Console=Y)', 'info');
        }
      } else if (consoleValue === 'N') {
        if (consoleToggleContainer) {
          consoleToggleContainer.style.display = 'none';
        }
        if (consoleSection) {
          consoleSection.style.display = 'none';
        }
      }
    }

    // Auth
    orgInput.addEventListener('keypress', async e => {
      if (e.key !== 'Enter') return;
      const orgValue = orgInput.value.trim();
      if (!orgValue) return status('ORG required', 'error');
      
      status('Authenticating...');
      logToConsole(`\n=== Authentication ===`, 'info');
      const res = await api('auth', { org: orgValue });
      
      if (!res.success) {
        status(res.error || 'Auth failed', 'error');
        return;
      }
      
      token = res.token;
      org = orgValue;
      status('Authenticated – ready! Loading orders...', 'success');
      logToConsole(`Authentication successful for ORG: ${org}`, 'success');
      
      // Hide ORG section after successful authentication
      const orgSection = document.getElementById('orgSection');
      if (orgSection) {
        orgSection.style.display = 'none';
      }
      
      mainUI.style.display = 'block';
      
      // Initialize table headers after UI is shown
      setTimeout(() => {
        initializeTableHeaders();
        updateSortIndicators();
      }, 100);
      
      // Automatically search for orders after authentication
      await loadOrders();
    });

    // Load orders
    async function loadOrders() {
      if (!token || !org) return;
      
      status('Searching for orders with Status=7200...');
      const res = await api('searchOrders', { org, token });
      
      if (!res.success) {
        status('Failed to load orders: ' + (res.error || 'Unknown error'), 'error');
        return;
      }
      
      // Log API calls made by backend
      if (res.api_calls && Array.isArray(res.api_calls)) {
        logToConsole(`\n=== Backend API Calls ===`, 'info');
        res.api_calls.forEach((apiCall, index) => {
          logToConsole(`\n[Backend API Call ${index + 1}] ${apiCall.description}`, 'info');
          logToConsole(`Endpoint: ${apiCall.url}`, 'info');
          logToConsole(`Payload:`, 'info');
          logToConsole(JSON.stringify(apiCall.payload, null, 2), 'info');
          if (apiCall.response) {
            logToConsole(`Response Summary:`, 'info');
            logToConsole(JSON.stringify(apiCall.response, null, 2), 'info');
          }
        });
      }
      
      ordersData = res.results || [];
      
      // Filter out orders with OlpnCount = 0
      ordersData = ordersData.filter(order => (order.OlpnCount || 0) > 0);
      
      // Update DivertDateTime to be within last 2 hours in user's timezone
      const now = new Date();
      ordersData.forEach(order => {
        // Generate random time within last 2 hours (not in future)
        const hoursAgo = Math.random() * 2; // 0 to 2 hours
        const minutesAgo = Math.random() * 60; // 0 to 60 minutes
        const secondsAgo = Math.random() * 60; // 0 to 60 seconds
        
        const divertTime = new Date(now.getTime() - (hoursAgo * 3600 + minutesAgo * 60 + secondsAgo) * 1000);
        
        // Format as YYYY-MM-DD HH:MM:SS in user's local timezone
        const year = divertTime.getFullYear();
        const month = String(divertTime.getMonth() + 1).padStart(2, '0');
        const day = String(divertTime.getDate()).padStart(2, '0');
        const hours = String(divertTime.getHours()).padStart(2, '0');
        const minutes = String(divertTime.getMinutes()).padStart(2, '0');
        const seconds = String(divertTime.getSeconds()).padStart(2, '0');
        
        order.DivertDateTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      });
      
      if (ordersData.length === 0) {
        status('No orders found with Status=7200 (or all orders have 0 oLPNs)', 'error');
        renderResults([]);
        return;
      }
      
      status(`Found ${ordersData.length} orders`, 'success');
      
      // Apply saved sort
      const sortedData = sortOrders(ordersData, currentSort.column, currentSort.direction);
      updateSortIndicators();
      renderResults(sortedData);

      // URL Order/OrderId: if present and order exists in list, auto-select and open Order Detail
      if (urlOrder && urlOrder.trim()) {
        const orderIdNorm = urlOrder.trim().toLowerCase();
        const order = ordersData.find(o => (o.OrderId || o.orderId || '').toString().trim().toLowerCase() === orderIdNorm);
        if (order) {
          const orderIdVal = (order.OrderId || order.orderId || '').toString();
          const row = resultsBody.querySelector(`tr[data-order-id="${CSS.escape(orderIdVal)}"]`);
          if (row) selectRow(row, order);
          await openOrderDetailScreen();
        }
      }
    }

    // Render results
    function renderResults(results) {
      resultsBody.innerHTML = '';
      
      if (results.length === 0) {
        const row = document.createElement('tr');
        row.innerHTML = '<td colspan="5" class="text-center">No orders found</td>';
        resultsBody.appendChild(row);
        return;
      }
      
      results.forEach((order) => {
        const row = document.createElement('tr');
        row.dataset.orderId = order.OrderId;
        
        row.innerHTML = `
          <td>${order.OrderId || '—'}</td>
          <td>${order.Location || '—'}</td>
          <td>${order.OlpnCount || 0}</td>
          <td>${order.SVIA || '—'}</td>
          <td>${order.DivertDateTime || '—'}</td>
        `;
        row.onclick = () => selectRow(row, order);
        resultsBody.appendChild(row);
      });
    }

    // Select row
    function selectRow(row, order) {
      // Remove previous selection
      document.querySelectorAll('#resultsTable tbody tr').forEach(r => {
        r.classList.remove('selected-row');
      });
      
      // Add selection to clicked row
      row.classList.add('selected-row');
      selectedOrder = order;
      selectedEl.textContent = order.OrderId || 'None';
      selectOrderBtn.disabled = false;
      logToConsole(`Selected order: ${order.OrderId}`, 'info');
    }

    // Render Order Detail table from oLPN list (sort by OlpnId, show bundle icon/tooltip)
    // Exclude oLPNs with status >= 9000 (e.g. Cancelled after combine) so they are never displayed.
    function renderOrderDetailTable(olpns) {
      const statusUnder9000 = (o) => {
        const s = o.Status ?? o.status;
        if (s == null) return true;
        const n = parseInt(s, 10);
        return !Number.isNaN(n) && n < 9000;
      };
      const list = (olpns || []).filter(statusUnder9000);
      const sorted = [...list].sort((a, b) => {
        const idA = (a.OlpnId || a.olpnId || '').toString().toLowerCase();
        const idB = (b.OlpnId || b.olpnId || '').toString().toLowerCase();
        return idA.localeCompare(idB);
      });
      orderDetailTableBody.innerHTML = '';
      sorted.forEach(olpn => {
        const location = olpn.CurrentLocationId || olpn.currentLocationId || olpn.CurrentLocation || '—';
        const olpnId = olpn.OlpnId || olpn.olpnId || olpn.oLPNId || '—';
        const quantity = olpn.TotalQty ?? olpn.totalQty ?? olpn.TotalLpnQty ?? '—';
        const weight = olpn.Weight != null && olpn.Weight !== '' ? olpn.Weight : (olpn.EstimatedWeight != null && olpn.EstimatedWeight !== '' ? olpn.EstimatedWeight : '—');
        const raw = olpn.Extended?.CombinedOlpns ?? olpn.extended?.CombinedOlpns ?? '';
        let bundleCount = 0;
        let bundleOlpnIdsList = '';
        if (raw && typeof raw === 'string' && raw.trim()) {
          try {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) {
              bundleCount = arr.length + 1;
              const ids = [olpnId, ...arr.map(entry => (entry.OlpnId ?? entry.olpnId ?? '').toString()).filter(Boolean)];
              bundleOlpnIdsList = ids.join(', ');
            }
          } catch (e) {}
        } else if (Array.isArray(raw) && raw.length > 0) {
          bundleCount = raw.length + 1;
          const ids = [olpnId, ...raw.map(entry => (entry.OlpnId ?? entry.olpnId ?? '').toString()).filter(Boolean)];
          bundleOlpnIdsList = ids.join(', ');
        }
        const isBundle = bundleCount > 0;
        const tooltipText = bundleOlpnIdsList || `Bundle (${bundleCount} oLPNs)`;
        const olpnCellContent = isBundle
          ? `<span class="olpn-bundle-icon" title="${tooltipText.replace(/"/g, '&quot;')}"><i class="fas fa-boxes-stacked"></i></span> ${olpnId} (${bundleCount})`
          : olpnId;
        const row = document.createElement('tr');
        row.innerHTML = `<td>${location}</td><td>${olpnCellContent}</td><td>${quantity}</td><td>${weight}</td>`;
        orderDetailTableBody.appendChild(row);
      });
      if (selectedOrder) status(`Order ${selectedOrder.OrderId} – ${list.length} oLPN(s)`);
    }

    // Refetch oLPNs for current order from API and refresh the Order Detail table (no in-memory state)
    async function refreshOrderDetailOlpns() {
      if (!selectedOrder || !org || !token) return { success: false, error: 'No order selected or not authenticated.' };
      const res = await api('getOlpns', { org, token, orderId: selectedOrder.OrderId });
      if (!res.success) return { success: false, error: res.error || 'Unknown error' };
      const olpns = res.olpns || [];
      currentOrderOlpns = olpns;
      renderOrderDetailTable(currentOrderOlpns);
      return { success: true, olpns };
    }

    // Open Order Detail screen: load oLPNs for selectedOrder and show detail (used by Select Order and URL Order param)
    async function openOrderDetailScreen() {
      if (!selectedOrder || !token || !org) return;
      logToConsole(`\n=== Open Order Detail ===`, 'info');
      logToConsole(`Selected Order: ${selectedOrder.OrderId}`, 'info');
      status('Loading oLPNs...');
      const res = await api('getOlpns', { org, token, orderId: selectedOrder.OrderId });
      if (!res.success) {
        status('Failed to load oLPNs: ' + (res.error || 'Unknown error'), 'error');
        return;
      }
      const olpns = res.olpns || [];
      currentOrderOlpns = olpns;
      logToConsole(`Loaded ${olpns.length} oLPNs for order ${selectedOrder.OrderId}`, 'info');
      orderListScreen.style.display = 'none';
      orderDetailScreen.style.display = 'block';
      orderDetailOrderId.value = selectedOrder.OrderId || '';
      scanOlpnInput.value = '';
      addOlpnToBundleInput.value = '';
      removeOlpnFromBundleInput.value = '';
      setOrderDetailStatus('');
      scanOlpnInput.focus();
      renderOrderDetailTable(olpns);
      syncOrderDetailButtonState();
    }

    // Sync Order Detail button disabled state: enable only when inputs pass current validations (no API)
    function syncOrderDetailButtonState() {
      const norm = (s) => String(s || '').trim().toLowerCase();
      const olpnIdInList = (value) => {
        if (!value || !currentOrderOlpns.length) return false;
        const v = norm(value);
        return currentOrderOlpns.some(olpn => norm(olpn.OlpnId || olpn.olpnId || olpn.oLPNId || '') === v);
      };
      const getBundleRecord = () => {
        const bundleValue = scanOlpnInput.value.trim();
        if (!bundleValue) return null;
        const bundleNorm = norm(bundleValue);
        return currentOrderOlpns.find(olpn => norm(olpn.OlpnId || olpn.olpnId || olpn.oLPNId || '') === bundleNorm) || null;
      };
      const removeValueInBundle = (removeValue) => {
        const bundleRecord = getBundleRecord();
        if (!bundleRecord || !removeValue) return false;
        const currentRaw = bundleRecord.Extended?.CombinedOlpns ?? bundleRecord.extended?.CombinedOlpns ?? '';
        let combinedArray = [];
        if (currentRaw && typeof currentRaw === 'string' && currentRaw.trim()) {
          try {
            const parsed = JSON.parse(currentRaw);
            combinedArray = Array.isArray(parsed) ? parsed : [];
          } catch (e) {}
        } else if (Array.isArray(currentRaw)) combinedArray = currentRaw;
        const removeNorm = norm(removeValue);
        return combinedArray.some(entry => norm(entry.OlpnId ?? entry.olpnId ?? '') === removeNorm);
      };

      const bundleValid = olpnIdInList(scanOlpnInput.value.trim());
      updateBundleBtn.disabled = !bundleValid || !olpnIdInList(addOlpnToBundleInput.value.trim());
      removeFromBundleBtn.disabled = !bundleValid || !removeValueInBundle(removeOlpnFromBundleInput.value.trim());
    }

    // Select Order button – show Order Detail screen and load oLPNs
    selectOrderBtn.onclick = () => openOrderDetailScreen();

    // Real-time enable/disable Order Detail buttons as user types
    [scanOlpnInput, addOlpnToBundleInput, removeOlpnFromBundleInput].forEach(input => {
      input.addEventListener('input', syncOrderDetailButtonState);
      input.addEventListener('change', syncOrderDetailButtonState);
    });

    // Enter in Add oLPN to Bundle input clicks Add button (if enabled)
    addOlpnToBundleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!updateBundleBtn.disabled) updateBundleBtn.click();
      }
    });
    // Enter in Remove oLPN from Bundle input clicks Remove button (if enabled)
    removeOlpnFromBundleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!removeFromBundleBtn.disabled) removeFromBundleBtn.click();
      }
    });

    // Add oLPN to Bundle: flow is (1) Combine API first, (2) only if success update CombinedOlpns.
    // We build the CombinedOlpns payload BEFORE the Combine API because after the combine, the FromOlpnId
    // oLPN will have changed (status, items, quantity). We must record the ORIGINAL add-record data.
    updateBundleBtn.onclick = async () => {
      const bundleValue = scanOlpnInput.value.trim();
      const addValue = addOlpnToBundleInput.value.trim();
      
      if (!bundleValue) {
        status('Bundle oLPN is required', 'error');
        setOrderDetailStatus('Bundle oLPN is required', 'error');
        return;
      }
      if (!addValue) {
        status('Add oLPN to Bundle is required', 'error');
        setOrderDetailStatus('Add oLPN to Bundle is required', 'error');
        return;
      }
      
      const norm = (s) => String(s || '').trim().toLowerCase();
      const bundleNorm = norm(bundleValue);
      const addNorm = norm(addValue);
      
      const bundleRecord = currentOrderOlpns.find(olpn => {
        const id = (olpn.OlpnId || olpn.olpnId || olpn.oLPNId || '').toString().toLowerCase();
        return id === bundleNorm;
      });
      const addRecord = currentOrderOlpns.find(olpn => {
        const id = (olpn.OlpnId || olpn.olpnId || olpn.oLPNId || '').toString().toLowerCase();
        return id === addNorm;
      });
      
      if (!bundleRecord) {
        const msg = `"${bundleValue}" was not found in the oLPN list. Enter a valid Bundle oLPN.`;
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
        return;
      }
      if (!addRecord) {
        const msg = `"${addValue}" was not found in the oLPN list. Enter a valid Add oLPN to Bundle.`;
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
        return;
      }
      
      // API returns PK (uppercase) at top level of each oLPN; may be string or number
      const pkRaw = bundleRecord.PK ?? bundleRecord.Pk ?? bundleRecord.pk ?? bundleRecord.OlpnPk ?? bundleRecord.olpnPk ?? bundleRecord.PrimaryKey ?? bundleRecord.primaryKey;
      const pk = pkRaw != null ? String(pkRaw) : '';
      if (!pk) {
        const msg = 'Bundle oLPN record is missing PK; cannot update.';
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
        return;
      }
      
      // --- Build CombinedOlpns payload BEFORE calling Combine API ---
      // After the Combine API succeeds, the FromOlpnId (add oLPN) will be different (status, items, qty).
      // We need to store the ORIGINAL add-record data in CombinedOlpns, so we build it now from addRecord.
      const currentRaw = bundleRecord.Extended?.CombinedOlpns ?? bundleRecord.extended?.CombinedOlpns ?? '';
      let combinedArray = [];
      if (currentRaw && typeof currentRaw === 'string' && currentRaw.trim()) {
        try {
          const parsed = JSON.parse(currentRaw);
          combinedArray = Array.isArray(parsed) ? [...parsed] : [];
        } catch (e) {
          combinedArray = [];
        }
      } else if (Array.isArray(currentRaw)) {
        combinedArray = [...currentRaw];
      }
      const details = addRecord.OlpnDetail || addRecord.olpnDetail || addRecord.olpnDetails || [];
      const detailsForPayload = Array.isArray(details)
        ? details.map((d) => ({
            ItemId: d.ItemId ?? d.itemId ?? '',
            PackedQuantity: d.PackedQuantity ?? d.packedQuantity ?? 0
          }))
        : [];
      const addOlpnId = addRecord.OlpnId ?? addRecord.olpnId ?? addRecord.oLPNId ?? addValue;
      combinedArray.push({ OlpnId: addOlpnId, Details: detailsForPayload });
      const combinedOlpnsString = JSON.stringify(combinedArray);

      status('Combining oLPN...');
      setOrderDetailStatus('Combining oLPN...', 'info');
      updateBundleBtn.disabled = true;
      
      // Step 1: Call Combine oLPN API first. If it fails, we do NOT update CombinedOlpns.
      // FromOlpnId = the oLPN being added (add), ToOlpnId = the bundle oLPN.
      const combineRes = await api('splitCombineOlpn', {
        org,
        token,
        fromOlpnId: addValue,
        toOlpnId: bundleValue
      });
      
      if (!combineRes.success) {
        updateBundleBtn.disabled = false;
        const errMsg = combineRes.error || 'Combine oLPN failed';
        status(errMsg, 'error');
        setOrderDetailStatus(errMsg, 'error');
        return;
      }
      
      // Step 2: Combine succeeded; update Extended.CombinedOlpns with the pre-built payload (original add-record data).
      const res = await api('updateOlpnExtended', {
        org,
        token,
        olpnId: bundleValue,
        pk,
        combinedOlpns: combinedOlpnsString
      });
      
      updateBundleBtn.disabled = false;
      
      if (!res.success) {
        const errMsg = res.error || 'Update CombinedOlpns failed';
        status(errMsg, 'error');
        setOrderDetailStatus(errMsg, 'error');
        return;
      }
      addOlpnToBundleInput.value = '';
      syncOrderDetailButtonState();
      // After combine, Manhattan updates FromOlpnId to status 9000 (Cancelled). Poll getOlpns until
      // the added oLPN is no longer in the response (backend filters status >= 9000), then refresh.
      const addedOlpnIdNorm = addValue.trim().toLowerCase();
      const maxAttempts = 20;
      const pollMs = 400;
      let refresh = { success: false };
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        setOrderDetailStatus(`Refreshing list${attempt > 0 ? ` (checking for status 9000…)` : ''}...`, 'info');
        const res = await api('getOlpns', { org, token, orderId: selectedOrder.OrderId });
        if (!res.success) {
          refresh = res;
          break;
        }
        const olpns = res.olpns || [];
        const stillInList = olpns.some(o => (o.OlpnId || o.olpnId || o.oLPNId || '').toString().trim().toLowerCase() === addedOlpnIdNorm);
        if (!stillInList) {
          currentOrderOlpns = olpns;
          renderOrderDetailTable(currentOrderOlpns);
          refresh = { success: true };
          break;
        }
        if (attempt < maxAttempts - 1) await new Promise(r => setTimeout(r, pollMs));
      }
      if (refresh.success) {
        status(`Added oLPN "${addValue}" to bundle.`, 'success');
        setOrderDetailStatus(`Added oLPN "${addValue}" to bundle.`, 'success');
      } else {
        const err = refresh.error || 'Refresh failed or status 9000 not seen in time';
        status(`Added oLPN "${addValue}" to bundle. ${err}`, 'error');
        setOrderDetailStatus(`Added to bundle but ${err}`, 'error');
        const fallback = await refreshOrderDetailOlpns();
        if (fallback.success) setOrderDetailStatus(`Added oLPN "${addValue}" to bundle. List refreshed.`, 'info');
      }
    };

    // Remove from Bundle: call Split API once per item (ItemId/Quantity from CombinedOlpns Details).
    // Update CombinedOlpns after each successful Split so the field stays accurate if some items fail.
    removeFromBundleBtn.onclick = async () => {
      const bundleValue = scanOlpnInput.value.trim();
      const removeValue = removeOlpnFromBundleInput.value.trim();

      if (!bundleValue) {
        status('Bundle oLPN is required', 'error');
        setOrderDetailStatus('Bundle oLPN is required', 'error');
        return;
      }
      if (!removeValue) {
        status('Remove oLPN from Bundle is required', 'error');
        setOrderDetailStatus('Remove oLPN from Bundle is required', 'error');
        return;
      }

      const norm = (s) => String(s || '').trim().toLowerCase();
      const bundleNorm = norm(bundleValue);
      const removeNorm = norm(removeValue);

      const bundleRecord = currentOrderOlpns.find(olpn => {
        const id = (olpn.OlpnId || olpn.olpnId || olpn.oLPNId || '').toString().toLowerCase();
        return id === bundleNorm;
      });

      if (!bundleRecord) {
        const msg = `"${bundleValue}" was not found in the oLPN list. Enter a valid Bundle oLPN.`;
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
        return;
      }

      const currentRaw = bundleRecord.Extended?.CombinedOlpns ?? bundleRecord.extended?.CombinedOlpns ?? '';
      let combinedArray = [];
      if (currentRaw && typeof currentRaw === 'string' && currentRaw.trim()) {
        try {
          const parsed = JSON.parse(currentRaw);
          combinedArray = Array.isArray(parsed) ? parsed.map(e => ({ ...e, Details: [...(e.Details || e.details || [])] })) : [];
        } catch (e) {
          combinedArray = [];
        }
      } else if (Array.isArray(currentRaw)) {
        combinedArray = currentRaw.map(e => ({ ...e, Details: [...(e.Details || e.details || [])] }));
      }

      const entryIndex = combinedArray.findIndex(entry => norm(entry.OlpnId ?? entry.olpnId ?? '') === removeNorm);
      if (entryIndex === -1) {
        const msg = `"${removeValue}" was not found in the bundle's CombinedOlpns. Enter an oLPN that is in the bundle.`;
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
        return;
      }

      const entry = combinedArray[entryIndex];
      const details = entry.Details || entry.details || [];
      if (details.length === 0) {
        status(`No item details for "${removeValue}" in CombinedOlpns; cannot split.`, 'error');
        setOrderDetailStatus(`No item details for "${removeValue}" in CombinedOlpns.`, 'error');
        return;
      }

      const pkRaw = bundleRecord.PK ?? bundleRecord.Pk ?? bundleRecord.pk ?? bundleRecord.OlpnPk ?? bundleRecord.olpnPk ?? bundleRecord.PrimaryKey ?? bundleRecord.primaryKey;
      const pk = pkRaw != null ? String(pkRaw) : '';
      if (!pk) {
        status('Bundle oLPN record is missing PK; cannot update.', 'error');
        setOrderDetailStatus('Bundle oLPN record is missing PK.', 'error');
        return;
      }

      removeFromBundleBtn.disabled = true;
      const errors = [];
      let successCount = 0;
      const detailsCount = details.length;

      for (let i = 0; i < details.length; i++) {
        const d = details[i];
        const itemId = (d.ItemId ?? d.itemId ?? '').toString();
        const qty = d.PackedQuantity ?? d.packedQuantity ?? 0;
        setOrderDetailStatus(`Removing from bundle (item ${i + 1}/${details.length})...`, 'info');

        const splitRes = await api('splitOlpn', {
          org,
          token,
          fromOlpnId: bundleValue,
          toOlpnId: removeValue,
          itemId,
          quantity: qty
        });

        if (splitRes.success) {
          successCount++;
          const entryNow = combinedArray.find(e => norm(e.OlpnId ?? e.olpnId ?? '') === removeNorm);
          if (entryNow && entryNow.Details) {
            const di = entryNow.Details.findIndex(x => (x.ItemId ?? x.itemId ?? '').toString() === itemId && (x.PackedQuantity ?? x.packedQuantity ?? 0) === qty);
            if (di !== -1) entryNow.Details.splice(di, 1);
            if (entryNow.Details.length === 0) {
              const idx = combinedArray.findIndex(e => norm(e.OlpnId ?? e.olpnId ?? '') === removeNorm);
              if (idx !== -1) combinedArray.splice(idx, 1);
            }
          }
          const combinedOlpnsString = JSON.stringify(combinedArray);
          const updateRes = await api('updateOlpnExtended', { org, token, olpnId: bundleValue, pk, combinedOlpns: combinedOlpnsString });
          if (updateRes.success) {
            if (!bundleRecord.Extended) bundleRecord.Extended = {};
            if (!bundleRecord.extended) bundleRecord.extended = {};
            bundleRecord.Extended.CombinedOlpns = combinedOlpnsString;
            bundleRecord.extended.CombinedOlpns = combinedOlpnsString;
          }
        } else {
          errors.push(`Item ${itemId} qty ${qty}: ${splitRes.error || 'Split failed'}`);
        }
      }

      removeFromBundleBtn.disabled = false;
      removeOlpnFromBundleInput.value = '';
      syncOrderDetailButtonState();

      // Clear Extended.CombinedOlpns on the To LPN (split-out oLPN) without refreshing the screen.
      // Get To LPN's PK via getOlpnPk (no UI refresh), then clear, then refresh once (no flashing/bad data).
      if (successCount > 0) {
        setOrderDetailStatus('Clearing To LPN...', 'info');
        const pkRes = await api('getOlpnPk', { org, token, orderId: selectedOrder.OrderId, olpnId: removeValue });
        if (pkRes.success && pkRes.pk) {
          await api('updateOlpnExtended', { org, token, olpnId: removeValue, pk: pkRes.pk, combinedOlpns: '[]' });
        }
      }
      setOrderDetailStatus('Refreshing list...', 'info');
      await refreshOrderDetailOlpns();

      if (successCount === detailsCount) {
        const msg = `oLPN ${removeValue} removed from bundle ${bundleValue}.`;
        status(msg, 'success');
        setOrderDetailStatus(msg, 'success');
      } else if (successCount > 0) {
        const errMsg = errors.length ? ` ${errors.join('; ')}` : '';
        const msg = `oLPN ${removeValue} removed from bundle ${bundleValue} (${successCount}/${detailsCount} item(s)).${errMsg}`;
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
      } else {
        const msg = errors.length ? errors[0] : `Failed to remove oLPN ${removeValue} from bundle ${bundleValue}.`;
        status(msg, 'error');
        setOrderDetailStatus(msg, 'error');
      }
    };

    // Back button – return to Order List screen
    orderDetailBackBtn.onclick = () => {
      orderDetailScreen.style.display = 'none';
      orderListScreen.style.display = 'block';
      status(`Found ${ordersData.length} orders`, 'success');
    };

    // Initialize table header click handlers
    function initializeTableHeaders() {
      const headers = document.querySelectorAll('#resultsTable th[data-sort]');
      headers.forEach(header => {
        header.addEventListener('click', () => handleHeaderClick(header));
      });
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      
      // Load theme and sort preferences
      loadTheme();
      
      // Initialize table headers for sorting
      initializeTableHeaders();
      
      // Re-initialize headers after mainUI is shown (they might not exist yet)
      const observer = new MutationObserver(() => {
        if (mainUI.style.display !== 'none') {
          initializeTableHeaders();
          updateSortIndicators();
        }
      });
      if (mainUI) {
        observer.observe(mainUI, { attributes: true, attributeFilter: ['style'] });
      }
      
      // Check for Organization parameter in URL and auto-authenticate
      if (urlOrg && urlOrg.trim()) {
        // Populate the input field
        if (orgInput) {
          orgInput.value = urlOrg.trim();
        }
        
        // Auto-authenticate
        orgInput.dispatchEvent(new KeyboardEvent('keypress', { key: 'Enter' }));
      }
    });
  </script>
</body>
</html>
